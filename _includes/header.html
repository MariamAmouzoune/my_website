<header class="site-header" id="siteHeader">
    <div class="header-inner">
        <a href="{{ '/index.html' | relative_url }}" class="logo-link" aria-label="Mariam Amouzoune – Home">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                <path d="M14 3C14 3 6 8 6 16C6 20.4 9.6 24 14 24C18.4 24 22 20.4 22 16C22 8 14 3 14 3Z" fill="#2d5c42" stroke="#c8a84b" stroke-width="1.5"/>

            </svg>
            <span class="logo-text">Mariam Amouzoune</span>
        </a>
        <nav class="desktop-nav" aria-label="Main navigation">
            <a href="{{ '/index.html' | relative_url }}" class="nav-link{% if page.nav == 'home' %} active{% endif %}" {% if page.nav == 'home' %}aria-current="page"{% endif %}>Home</a>
            <a href="{{ '/about.html' | relative_url }}" class="nav-link{% if page.nav == 'about' %} active{% endif %}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a>
            <a href="{{ '/research.html' | relative_url }}" class="nav-link{% if page.nav == 'research' %} active{% endif %}" {% if page.nav == 'research' %}aria-current="page"{% endif %}>Research</a> 
            <span class="port-item">
                <a href="{{ '/portfolio.html' | relative_url }}" class="nav-link{% if page.nav == 'portfolio' %} active{% endif %}" {% if page.nav == 'portfolio' %}aria-current="page"{% endif %}>Portfolio</a>
                <ul class="port-dropdown" role="menu">
                    <li class="port-dropdown-hdr">Projects</li>
                    <li>
                        <a href="{{ '/portfolio/rice-rnaseq/rice-rnaseq-tutorial.html' | relative_url }}" class="proj-link">
                            <span class="proj-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
                            <span>
                                <span class="proj-title-dd">Rice RNA-seq &amp; <em>M. oryzae</em></span>
                                <span class="proj-tag-dd">RNA-seq · DESeq2 · HISAT2</span>
                            </span>
                        </a>
                    </li>
                    <li class="port-view-all">
                        <a href="{{ '/portfolio.html' | relative_url }}">View all projects
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        </a>
                    </li>
                </ul>
            </span>
            <a href="{{ '/contact.html' | relative_url }}" class="nav-link{% if page.nav == 'contact' %} active{% endif %}" {% if page.nav == 'contact' %}aria-current="page"{% endif %}>Contact</a>
        </nav>
        <button class="hamburger-btn" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="5" x2="20" y2="5"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="19" x2="20" y2="19"/>

        <a href="{{ '/index.html' | relative_url }}" class="active" aria-current="page">Home</a>
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ '/research.html' | relative_url }}">Research</a>
        <a href="{{ '/portfolio.html' | relative_url }}">Portfolio</a>
